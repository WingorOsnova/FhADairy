[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fachabi-diary"
version = "0.1.0"
description = "Local desktop diary for Brandenburg Fachabi weekly internship reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7",
  "reportlab>=4.2",
  "pypdf>=4.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pyinstaller>=6.10",
]

[project.scripts]
fachabi-diary = "fachabi_diary.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
